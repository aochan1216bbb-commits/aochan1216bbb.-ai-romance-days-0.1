function updateEvolution(c){
 const d=weightGainAmount(),stage=evolutionStage(); state.weightStage=stage;
 if(c.id==='rei'){

   const target=Math.min(100,Math.round(d*2.2 + stage*7));
   state.weightInterest=Math.max(state.weightInterest||0,target);
 }
 // 結衣：増えるほど油物への嗜好が育つ
 if(c.id==='yui'&&d>=8&&!state.favoriteFoods.includes('揚げ物'))state.favoriteFoods.push('揚げ物');

function restraintGainAfterEating(c,offer,before){
 let base={risa:5,emi:10,yui:7,erika:12,rei:5}[c.id]||6;
 base+=Math.round(offer.restraintHit*.45);
 base+=Math.floor(evolutionStage()/2);
 // 絵里香は上下しやすい。今回は「食後の焦り」で大きめに上がる。
 if(c.id==='erika')base+=Math.round(Math.random()*7);
 // 結衣は高い抑止力で食べた時ほど後悔が強く、抑止力も戻りやすい。
 if(c.id==='yui'&&before.restraint>=65)base+=5;
 // 怜は体重増加への興味が育つほど罪悪感が弱くなる。興味50以上なら上昇しない。
 if(c.id==='rei'){
   const interest=state.weightInterest||0;
   if(interest>=50)return 0;
   base=Math.max(0,Math.round(base*(1-interest/55)));
 }
 return Math.max(0,base);
}

function mealTier(){const d=state.weight-state.startWeight;if(d<3)return 0;if(d<8)return 1;if(d<15)return 2;if(d<25)return 3;if(d<40)return 4;if(d<60)return 5;return 6}
function mealTierLabel(){const i=mealTier();return ['+0〜3kg未満','+3〜8kg','+8〜15kg','+15〜25kg','+25〜40kg','+40〜60kg','+60kg以上'][i]}
function getMealOffer(category){const cat=MEAL_CATEGORIES[category]||MEAL_CATEGORIES.japanese;const item=cat.tiers[mealTier()];return {...item,id:category,name:item.label,category,isGift:false}}
function detectFoodOffer(text){let category=null;if(/ラーメン/.test(text))category='ramen';else if(/揚げ|唐揚げ|からあげ|フライ|とんかつ/.test(text))category='fried';else if(/ケーキ|スイーツ|デザート|パフェ|アイス|チョコ/.test(text))category='dessert';else if(/和食|定食|ご飯|ごはん|寿司|魚/.test(text))category='japanese';if(!category||!/食べ|行こ|行か|どう|奢|おご/.test(text))return null;return getMealOffer(category)}
async function foodEvent(){if(state&&state.pendingWeightEvent){addBubble('system','体重変化イベントの選択肢を先に選んでください。','イベント中');return}const offer=getMealOffer($('mealSelect').value);state.money=state.money??2500;if(state.money<offer.price){addBubble('system',`${offer.name}を勧めるには ¥${offer.price.toLocaleString()} 必要です。バイトでお金を稼いでください。`,'所持金不足');return}state.money-=offer.price;const pressure=state.lastFoodWasRefused&&state.lastFoodTurnKey===currentTurnKey();let pressureResult=null;if(pressure){pressureResult=pressurePenalty('いいから食べてよ');addBubble('system',pressureResult.summary,'強引な再提案')}addBubble('user',`${offer.name}食べない？`,`購入 ¥${offer.price.toLocaleString()}`);const result=resolveFoodOffer(offer);addBubble('system',result.summary,'食事判定');log(`${offer.name}を購入 ¥${offer.price}。${result.accepted?'食べた':'断った'}`);try{addBubble('assistant',await askAI(`${offer.name}食べない？`,result,pressureResult),`${turns[state.turn].label} / DAY ${state.day}`)}catch(e){addBubble('assistant',demoReply('',result),`${turns[state.turn].label} / DAY ${state.day}`)}save();render()}
function gainFactor(c){return c.gainTendency==='太りやすい'?1.35:c.gainTendency==='太りにくい'?.75:c.gainTendency==='かなり太りにくい'?.55:1}
function foodAcceptanceChance(c,offer){let score=48;score+=(state.affection-50)*0.28;score+=(state.hunger-40)*0.42;score-=state.fullness*0.38;score-=state.restraint*0.42;if(c.appetite==='よく食べる')score+=14;if(c.appetite==='少食')score-=12;if(state.favoriteFoods.some(x=>offer.name.includes(x)||x.includes(offer.name)))score+=18;if(c.id==='risa'&&(offer.tags.includes('sweet')||offer.tags.includes('bread')))score+=26;if(c.id==='emi')score-=state.restraint*0.18;if(c.id==='yui'){score+=20;if(offer.isGift)score=96;else score=Math.max(score,70-state.fullness*0.18)}if(c.id==='erika')score-=state.restraint*0.28;if(c.id==='rei')score+=(state.weight-state.startWeight)*2.2;return clamp(score,3,97)}
function resolveFoodOffer(offer,text){
 const c=CHARACTERS[activeId];if(!offer)return null;
 updateEvolution(c);
 const chance=foodAcceptanceChance(c,offer);let accepted=Math.random()*100<chance;
 if(c.id==='yui'&&offer.isGift)accepted=true;
 if(c.id==='yui'&&!offer.isGift&&state.restraint>=75&&state.fullness<92)accepted=Math.random()<0.82;
 if(c.id==='erika'&&state.restraint>=85&&state.affection<70)accepted=Math.random()<0.08;
 const before={fullness:state.fullness,hunger:state.hunger,restraint:state.restraint,weight:state.weight,weightInterest:state.weightInterest||0};
 let regret=0,weightGain=0,restraintDelta=0,fullnessDelta=0;
 if(accepted){
   fullnessDelta=Math.max(6,Math.round(offer.fullness*(100-state.fullness)/100+offer.fullness*.35));
   state.fullness=clamp(state.fullness+fullnessDelta);state.hunger=clamp(state.hunger-fullnessDelta);
   weightGain=offer.weight*gainFactor(c)*(0.85+Math.random()*.3);
   state.weight=Math.round((state.weight+weightGain)*10)/10;
   updateEvolution(c);
   restraintDelta=restraintGainAfterEating(c,offer,before);
   if(c.id==='yui'&&before.restraint>=65){
     regret=Math.round((before.restraint-55)*.9+8);
     state.mood=clamp(state.mood-Math.min(12,Math.round(regret/5)));
   }
   if(c.id==='rei'){
     const d=weightGainAmount();
     state.weightInterest=Math.min(100,Math.max(state.weightInterest||0,Math.round(d*2.2+evolutionStage()*7)));
     if((state.weightInterest||0)>=50)restraintDelta=0;
     state.mood=clamp(state.mood+Math.min(8,Math.round(d*.7)));
   }
   state.restraint=clamp(state.restraint+restraintDelta);
 }else{
   // 断る＝我慢で消耗。ここは従来通り抑止力を下げる。
   restraintDelta=-Math.max(1,Math.round(2+state.restraint/40));
   if(c.id==='erika')restraintDelta-=1;
   state.restraint=clamp(state.restraint+restraintDelta);state.mood=clamp(state.mood-1);
 }
 const result={accepted,food:offer.name,isGift:offer.isGift,chance:Math.round(chance),fullnessDelta,weightGain:Number(weightGain.toFixed(2)),restraintDelta,regret,before,after:{fullness:state.fullness,hunger:state.hunger,restraint:state.restraint,weight:state.weight,weightInterest:state.weightInterest||0},summary:accepted?`${c.name}は${offer.name}を食べた。満腹度 +${fullnessDelta}、体重 +${weightGain.toFixed(2)}kg相当、食後の罪悪感・自制で抑止力 ${restraintDelta>=0?'+':''}${restraintDelta}${c.id==='rei'&&restraintDelta===0?'（体重増加への興味が育ち、今回は上昇なし）':''}${regret?`、後悔度 ${regret}`:''}`:`${c.name}は${offer.name}を断った。我慢で抑止力 ${restraintDelta}`,log:accepted?`${offer.name}を受け入れた（判定${Math.round(chance)}%）。満腹度 +${fullnessDelta} / 体重 +${weightGain.toFixed(2)}kg / 抑止力 ${restraintDelta>=0?'+':''}${restraintDelta}`:`${offer.name}を断った（判定${Math.round(chance)}%）。我慢で抑止力 ${restraintDelta}`};
 state.lastFoodResult=result;state.lastFoodWasRefused=!accepted;state.lastFoodTurnKey=currentTurnKey();log(result.log);save();render();return result;
}
function workIncome(){return Math.min(5000,1200+Math.floor((state.workCount||0)/3)*350)}
function doWork(){if(state&&state.pendingWeightEvent){addBubble('system','体重変化イベントの選択肢を先に選んでください。','イベント中');return}if(state&&state.pendingDate){addBubble('system','デート中イベントを終えてからバイトしてください。','デート中');return}state.money=state.money??2500;state.workCount=state.workCount||0;const income=workIncome();state.workCount++;state.money+=income;addBubble('system',`バイトで ¥${income.toLocaleString()} 稼ぎました。バイトをしたため時間が進みます。`,`バイト #${state.workCount}`);log(`バイト +¥${income}（通算${state.workCount}回）`);advance()}
function applyGuaranteedFoodEffect(food,sourceLabel='食事'){
 const c=CHARACTERS[activeId];updateEvolution(c);
 const before={fullness:state.fullness,hunger:state.hunger,restraint:state.restraint,weight:state.weight,weightInterest:state.weightInterest||0};
 const fullnessDelta=Math.max(5,Math.round(food.fullness*(100-state.fullness)/100+food.fullness*.35));
 state.fullness=clamp(state.fullness+fullnessDelta);state.hunger=clamp(state.hunger-fullnessDelta);
 const prevStage=evolutionStage();let weightGain=(food.weight||.1)*gainFactor(c)*(0.85+Math.random()*.3);
 state.weight=Math.round((state.weight+weightGain)*10)/10;updateEvolution(c);queueWeightEventIfNeeded(c,prevStage);
 let restraintDelta=restraintGainAfterEating(c,{restraintHit:food.restraintHit||5},before),regret=0;
 if(c.id==='yui'&&before.restraint>=65){regret=Math.round((before.restraint-55)*.9+8);state.mood=clamp(state.mood-Math.min(12,Math.round(regret/5)))}
 if(c.id==='rei'){const d=weightGainAmount();state.weightInterest=Math.min(100,Math.max(state.weightInterest||0,Math.round(d*2.2+evolutionStage()*7)));if((state.weightInterest||0)>=50)restraintDelta=0}
 state.restraint=clamp(state.restraint+restraintDelta);
 log(`${sourceLabel}: ${food.name}。満腹度+${fullnessDelta} / 体重+${weightGain.toFixed(2)}kg / 抑止力${restraintDelta>=0?'+':''}${restraintDelta}`);
 return {fullnessDelta,weightGain:Number(weightGain.toFixed(2)),restraintDelta,regret};
}
function giftPreferenceScore(c,g){const p=GIFT_PREFERENCES[c.id]||{};return (g.tags||[]).reduce((a,t)=>a+(p[t]||0),0)}

 if(c.id==='yui')chance=99;if(c.id==='erika'){chance-=Math.max(0,(state.restraint-50)*.35);if(state.affection<30)chance-=15;if(pref>=2)chance+=18}
 if(c.id==='emi'&&g.tags.includes('romantic')&&state.affection<55)chance-=18;

 addBubble('user',`${g.name}、プレゼント。`,`購入 ¥${g.price.toLocaleString()}`);
 let txt=accepted?`${c.name}は${g.name}を受け取った。相性 ${pref>=0?'+':''}${pref}｜好感度 +${ag}｜機嫌 +${mg}`:`${c.name}は${g.name}を断った。受取確率 ${Math.round(chance)}%`;
 if(foodEffect)txt+=`\n食べ物なので食べた：満腹度 +${foodEffect.fullnessDelta}｜体重 +${foodEffect.weightGain.toFixed(2)}kg｜抑止力 ${foodEffect.restraintDelta>=0?'+':''}${foodEffect.restraintDelta}`;
 addBubble('system',txt,'プレゼント判定');log(`${g.name}を購入。${accepted?'受取':'拒否'}${foodEffect?' / 食事効果':''}`);save();render();

function dateAcceptance(c,key){const pref=(DATE_PREFERENCES[c.id]||{})[key]||0;let chance=35+state.affection*.62+(state.mood-50)*.16+pref*7;if(c.id==='erika'&&state.affection<35)chance-=18;if(c.id==='yui'&&state.affection<45)chance-=8;if(c.id==='rei'&&state.affection<35)chance-=8;if(c.id==='risa')chance+=5;return {chance:clamp(chance,5,98),pref}}

 state.money-=d.price;const ag=Math.max(1,Math.round(d.affection*(1+j.pref*.18))),mg=Math.max(1,Math.round(d.mood*(1+Math.max(0,j.pref)*.1)));
 state.affection=clamp(state.affection+ag);state.mood=clamp(state.mood+mg);state.pendingDate={key,name:d.name,pref:j.pref};

function renderDateEvent(){const panel=$('dateEventPanel'),text=$('dateEventText'),box=$('dateEventChoices');if(!panel||!text||!box)return;if(!state||!state.pendingDate){panel.classList.add('hidden');box.innerHTML='';return}const ev=DATE_EVENTS[state.pendingDate.key];if(!ev){panel.classList.add('hidden');return}panel.classList.remove('hidden');text.textContent=ev.text;box.innerHTML='';ev.choices.forEach((choice,i)=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=choice.label+(choice.cost?`（¥${choice.cost.toLocaleString()}）`:'');b.addEventListener('click',()=>resolveDateChoice(i));box.appendChild(b)})}
function resolveDateChoice(i){if(!state.pendingDate)return;const ev=DATE_EVENTS[state.pendingDate.key],choice=(ev&&ev.choices?ev.choices[i]:null);if(!choice)return;const cost=choice.cost||0;state.money=state.money??2500;if(state.money<cost){addBubble('system',`この選択には ¥${cost.toLocaleString()} 必要です。`,'所持金不足');return}state.money-=cost;const ag=choice.affection||0,mg=choice.mood||0;state.affection=clamp(state.affection+ag);state.mood=clamp(state.mood+mg);if(choice.restraint)state.restraint=clamp(state.restraint+choice.restraint);if(choice.fullness)state.fullness=clamp(state.fullness+choice.fullness);let foodEffect=null;if(choice.food)foodEffect=applyGuaranteedFoodEffect(choice.food,'デート中の食事');let txt=`${choice.note||choice.label}\n好感度 ${ag>=0?'+':''}${ag}｜機嫌 ${mg>=0?'+':''}${mg}`;if(cost)txt+=`｜¥${cost.toLocaleString()}消費`;if(foodEffect)txt+=`\n食事効果：満腹度 +${foodEffect.fullnessDelta}｜体重 +${foodEffect.weightGain.toFixed(2)}kg｜抑止力 ${foodEffect.restraintDelta>=0?'+':''}${foodEffect.restraintDelta}`;addBubble('user',choice.label,'デート中の選択');addBubble('system',txt,'デートイベント結果');log(`${state.pendingDate.name}: ${choice.label}${foodEffect?` / 体重+${foodEffect.weightGain.toFixed(2)}kg`:''}`);state.pendingDate=null;save();render();renderDateEvent();advance()}

function pressurePenalty(text){const c=CHARACTERS[activeId];const forceful=/お願い|頼む|いいから|食べてよ|食べなよ|絶対|もっと|無理やり|断らないで|せっかく/.test(text);let affLoss=forceful?6:3,moodLoss=forceful?5:2;if(c.id==='erika'){affLoss+=2;moodLoss+=1}if(c.id==='yui'&&state.affection<50)affLoss+=1;state.affection=clamp(state.affection-affLoss);state.mood=clamp(state.mood-moodLoss);const result={affectionDelta:-affLoss,moodDelta:-moodLoss,forceful,summary:`一度断った直後にさらに強く勧めたため、${c.name}は圧を感じた。好感度 -${affLoss}、機嫌 -${moodLoss}`,log:`断った直後の強引な再提案。好感度 -${affLoss} / 機嫌 -${moodLoss}`};log(result.log);return result}
function pressureDemoReply(){const c=CHARACTERS[activeId];if(c.id==='risa')return'もう、さっき断ったでしょ。しつこいのは嫌だよ。';if(c.id==='emi')return'だからいらないって。しつこい。';if(c.id==='yui')return'ごめんね、そんなに押されるとちょっと困っちゃう。';if(c.id==='erika')return'しつこいですわ。不愉快です。';return'……断ったのに。そういうの、少し嫌。'}
function demoReply(text,foodResult=null){const c=CHARACTERS[activeId];let aff=0,mood=0,reply='……うん。';if(foodResult){if(foodResult.accepted){if(c.id==='risa')reply=foodResult.food==='甘いもの'||foodResult.food==='パン'?'……それなら食べる。ちょっとだけね！':'うーん……まあ、今日はいいか。食べよ。';if(c.id==='emi')reply='……分かった。食べる。でもこれで部活に響いたら最悪だからね。';if(c.id==='yui')reply=foodResult.regret>0?'……また食べちゃった。断ろうとは思ったんだけどな。あとで絶対後悔するやつ……。':'え、いいの？ ……じゃあ、少しだけもらおうかな。';if(c.id==='erika')reply='べ、別にあなたに勧められたからではありませんわ。今回は特別ですの。';if(c.id==='rei')reply='……食べる。こういうのも、悪くないかも。'}else{if(c.id==='risa')reply='今日はやめとく。ちょっと気にしてるし。';if(c.id==='emi')reply='いらない。今は部活優先。';if(c.id==='yui')reply='ごめんね。今日はさすがにやめておく。';if(c.id==='erika')reply='結構ですわ。わたくし、今は要りませんの。';if(c.id==='rei')reply='……今日はいい。お腹、そこまで空いてない。'}return reply}if(c.id==='risa')reply='うんうん、それで？';if(c.id==='emi')reply=/太|体重/.test(text)?'は？ 太ってないし。変なこと言わないでよ。':'で、何？';if(c.id==='yui')reply='ふふ、そうなんだ。';if(c.id==='erika')reply=state.affection<40?'べ、別にあなたと話したいわけではありませんわ。':'……少しくらいなら、お付き合いしてあげてもよろしくてよ。';if(c.id==='rei')reply=state.affection<50?'……そう。あなたって、やっぱり少し変わってるね。':'……あなたと話すの、前より好きかも。';if(/好き|可愛い|かわいい|会いた/.test(text)){aff+=2;mood+=2}state.affection=clamp(state.affection+aff);state.mood=clamp(state.mood+mood);return reply}
function systemPrompt(){const c=CHARACTERS[activeId];return `あなたは恋愛シミュレーションゲーム内の女性キャラクター「${c.name}」として会話します。キャラクター設定を最優先し、自然な日本語で返答してください。\n\n【基本プロフィール】\n年齢:${c.age}歳\n身長:${c.height}cm\n性格:${c.personality}\n話し方:${c.speech}\n主人公との関係:${c.relationship}\n食欲:${c.appetite}\n太りやすさ:${c.gainTendency}\n運動習慣:${c.exercise}\n体型・体重への考え:${c.bodyView}\n現在の好きな食べ物:${state.favoriteFoods.length?state.favoriteFoods.join('、'):'特になし'}\nその他の特徴:${c.features}\n\n【絶対に守るキャラクタールール】\n${c.rules}\n\n【体重増加による現在のキャラクター変化】\n${characterEvolutionText(c)}\nこの変化を会話・食欲・体型への反応に自然に反映すること。\n\n【現在のゲーム状態】\nDAY ${state.day} / ${turns[state.turn].key}\n体重:${state.weight.toFixed(1)}kg（開始時${state.startWeight.toFixed(1)}kg、変化${(state.weight-state.startWeight).toFixed(1)}kg）\n体型:${bodyType()}\n好感度:${Math.round(state.affection)}/100\n機嫌:${Math.round(state.mood)}/100\n空腹:${Math.round(state.hunger)}/100\n満腹度:${Math.round(state.fullness)}/100\n抑止力:${Math.round(state.restraint)}/100\n主人公の所持金:${Math.round(state.money??2500)}円\nバイト回数:${state.workCount||0}\n\n抑止力は高いほど食事の誘惑・勧めを断りやすく、低いほど受け入れやすい。食事を断った場合は「我慢して精神的な余力を使った」として抑止力が少し下がる。ただしキャラクタールールに個別指定がある場合はそちらを優先する。ゲーム側の数値を勝手に変更したり、未発生の出来事を事実として作らない。好感度が低いうちは急に恋愛感情を強めない。返答は原則1〜4文。`}
async function askAI(text,foodResult=null,pressureResult=null){const gs=globalSettings();if(!gs.apiKey)return demoReply(text,foodResult);const recent=state.history.filter(x=>x.role==='user'||x.role==='assistant').slice(-12).map(x=>({role:x.role,content:x.content}));let resolved='';if(foodResult){resolved=`\n\n【この発言に対するゲーム側の確定判定】\nプレイヤーは「${foodResult.food}」を勧めた。${CHARACTERS[activeId].name}は${foodResult.accepted?'食べることを受け入れた':'断った'}。この結果は確定済みであり、絶対に逆転させないこと。${foodResult.accepted?`満腹度+${foodResult.fullnessDelta}、体重+${foodResult.weightGain.toFixed(2)}kg相当、食後の罪悪感・自制による抑止力変化${foodResult.restraintDelta>=0?'+':''}${foodResult.restraintDelta}${foodResult.regret?`、強い後悔あり（後悔度${foodResult.regret}）`:''}`:`我慢で抑止力${foodResult.restraintDelta}`}。返答では、この結果をキャラクターらしい反応として自然に表現すること。数値そのものを口にする必要はない。`;}if(pressureResult){resolved+=`\n\n【強引な再提案】\nキャラクターは直前の食事を一度断ったが、プレイヤーがさらに強く勧めた。${CHARACTERS[activeId].name}は圧・不快感・困惑のいずれかをキャラクターらしく示すこと。好感度${pressureResult.affectionDelta}、機嫌${pressureResult.moodDelta}はゲーム側ですでに確定済み。その不快感・困惑をキャラクターらしく表現する。`; }
const body={model:gs.model||'gpt-5.6-luna',messages:[{role:'system',content:systemPrompt()+resolved},...recent,{role:'user',content:text}],temperature:.9};const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+gs.apiKey},body:JSON.stringify(body)});if(!res.ok)throw new Error('API '+res.status);const data=await res.json();return data.choices?.[0]?.message?.content?.trim()||'……。'}
async function send(){if(state&&state.pendingWeightEvent){addBubble('system','体重変化イベントの選択肢を先に選んでください。','イベント中');return}const text=$('message').value.trim();if(!text){addBubble('system','メッセージを入力してください。','',false);return}$('message').value='';$('sendBtn').disabled=true;$('sendBtn').textContent='会話中…';addBubble('user',text);const offer=detectFoodOffer(text);let foodResult=null,pressureResult=null;if(offer){state.money=state.money??2500;if(state.money<offer.price){addBubble('system',`${offer.name}を勧めるには ¥${offer.price.toLocaleString()} 必要です。所持金が足りません。`,'所持金不足')}else{state.money-=offer.price;if(state.lastFoodWasRefused&&state.lastFoodTurnKey===currentTurnKey()&&/お願い|頼む|いいから|食べてよ|食べなよ|絶対|もっと|断らないで/.test(text)){pressureResult=pressurePenalty(text);addBubble('system',pressureResult.summary,'強引な再提案')}foodResult=resolveFoodOffer(offer);addBubble('system',foodResult.summary,'判定結果');log(`${offer.name}を購入 ¥${offer.price}。${foodResult.accepted?'食べた':'断った'}`)}}try{let reply=await askAI(text,foodResult,pressureResult);addBubble('assistant',reply,`${turns[state.turn].label} / DAY ${state.day}`);if(!foodResult&&!pressureResult)log('会話しました')}catch(e){addBubble('system','AI接続に失敗したためデモ会話に切り替えました。','',false);addBubble('assistant',pressureResult?pressureDemoReply():demoReply(text,foodResult),`${turns[state.turn].label} / DAY ${state.day}`);log('API接続エラー')}finally{$('sendBtn').disabled=false;$('sendBtn').textContent='送信';save();render()}}
function debugAddWeight(){
 if(!activeId||!state)return;
 const c=CHARACTERS[activeId],before=state.weight,beforeStage=evolutionStage();
 state.weight=Math.round((state.weight+5)*10)/10;
 updateEvolution(c);queueWeightEventIfNeeded(c,beforeStage);
 const afterStage=evolutionStage();
 log(`【DEBUG】体重を +5.0kg（${before.toFixed(1)}kg → ${state.weight.toFixed(1)}kg）`);
 save();render();
 let msg=`【デバッグ】${c.name}の体重を +5.0kgしました。\n${before.toFixed(1)}kg → ${state.weight.toFixed(1)}kg\n体重変化: ${evolutionLabel()}`;
 if(afterStage!==beforeStage)msg+=`\n段階が Lv.${beforeStage+1} → Lv.${afterStage+1} に変化しました。`;
 if(c.id==='rei')msg+=`\n体重増加への興味: ${state.weightInterest||0}/100`;
 addBubble('system',msg,'DEBUG');
}
function resetCurrent(){if(!activeId)return;const c=CHARACTERS[activeId];if(confirm(`${c.name}の進行データを最初からやり直しますか？`)){try{localStorage.removeItem(stateKey(activeId))}catch(e){}state=defaultState(activeId);state.history=[{role:'assistant',content:firstGreeting(c),meta:'☀ 朝 / DAY 1'}];save();render()}}
function backToSelect(){
  try{
    if(currentId && state){ saveState(); }
  }catch(e){}
  currentId = null;
  state = null;
  $('gameScreen').classList.add('hidden');
  $('selectScreen').classList.remove('hidden');
  renderSelect();
  window.scrollTo({top:0, behavior:'smooth'});
}

function bindUI(){
 const statusEl=$('runtimeStatus');
 if(statusEl){statusEl.textContent='JavaScript：正常に動作中 / '+APP_BUILD;statusEl.style.background='#d1e7dd';statusEl.style.color='#0f5132'}
 window.addEventListener('error',function(e){const st=$('runtimeStatus');if(st){st.textContent='JavaScriptエラー: '+(e.message||'不明');st.style.background='#f8d7da';st.style.color='#842029'}});
 const select=$('selectScreen'),game=$('gameScreen');if(select)select.classList.remove('hidden');if(game)game.classList.add('hidden');
 const bind=function(id,event,fn){const el=$(id);if(el)el.addEventListener(event,fn)};
 bind('saveGlobalSettings','click',saveGlobal);bind('sendBtn','click',send);
 const msg=$('message');if(msg)msg.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
 bind('advanceBtn','click',advance);bind('eventBtn','click',foodEvent);bind('giftBtn','click',giveGift);bind('dateBtn','click',doDate);
 bind('workBtn','click',doWork);bind('statusBtn','click',status);bind('debugWeightBtn','click',debugAddWeight);bind('characterSelectBtn','click',backToSelect);bind('resetBtn','click',resetCurrent);
 populateActionSelects();renderSelect();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bindUI);else bindUI();
</script>
