<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI Romance Days</title>
<style>
:root{
  --bg:#f7f2f5;--card:#fff;--text:#2a2327;--muted:#7e7178;--accent:#c86f93;--accent2:#f0c4d5;
  --good:#4f9d69;--warn:#d1923b;--danger:#cc5e67;--shadow:0 8px 28px rgba(68,37,50,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(#f9f5f7,#efe5ea);color:var(--text);min-height:100vh}
button,input,textarea,select{font:inherit} button{touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08);cursor:pointer}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;padding:10px 0 8px;background:linear-gradient(rgba(247,242,245,.98),rgba(247,242,245,.88),rgba(247,242,245,0));backdrop-filter:blur(8px)}
.header{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.day{font-weight:800;font-size:20px}.turn{color:var(--accent);font-weight:800}.small{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.stat{background:var(--card);border-radius:14px;padding:9px 6px;text-align:center;box-shadow:0 4px 16px rgba(68,37,50,.08)}.stat b{display:block;font-size:14px}.stat span{font-size:11px;color:var(--muted)}
.hero{margin-top:8px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);position:relative}.hero img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eadde3}.badge{position:absolute;left:12px;bottom:12px;background:rgba(32,24,28,.72);color:#fff;padding:8px 10px;border-radius:12px;font-size:12px;backdrop-filter:blur(6px)}
.panel{background:var(--card);border-radius:20px;margin-top:10px;padding:14px;box-shadow:var(--shadow)}
.nameRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.name{font-size:20px;font-weight:800}.bodyType{font-size:12px;background:#f2e5eb;color:#8a4c68;padding:5px 8px;border-radius:999px}
.chat{height:280px;overflow:auto;padding:2px 2px 8px;scroll-behavior:smooth}.msg{max-width:86%;padding:10px 12px;border-radius:16px;margin:8px 0;line-height:1.5;white-space:pre-wrap;word-break:break-word}.ai{background:#f3e8ed;border-bottom-left-radius:5px}.you{margin-left:auto;background:#dceefc;border-bottom-right-radius:5px}.system{margin:8px auto;max-width:95%;background:#f4f4f4;color:#6e666a;font-size:12px;text-align:center}.meta{font-size:10px;color:#8c8187;margin-top:4px}
.composer{display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;min-height:48px;max-height:120px;resize:vertical;border:1px solid #dccbd3;border-radius:14px;padding:12px;background:#fff;outline:none}.composer textarea:focus{border-color:var(--accent)}.send{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:13px 16px;font-weight:800}.send:disabled{opacity:.45}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:0;border-radius:13px;padding:11px;background:#eee5e9;color:#4d4147;font-weight:700}.btn.primary{background:#2f2830;color:#fff}.btn.danger{background:#f7d9dc;color:#9c3842}
details{margin-top:10px}.settingsGrid{display:grid;gap:8px;margin-top:10px}.settingsGrid input,.settingsGrid select{width:100%;border:1px solid #dccbd3;border-radius:11px;padding:10px}.hint{font-size:11px;color:var(--muted);line-height:1.45}.log{font-size:12px;max-height:150px;overflow:auto;background:#faf7f8;border-radius:12px;padding:8px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#f4eef1;margin:2px;font-size:11px}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.chat{height:240px}}
</style>
</head>
<body>
<noscript><div style="max-width:640px;margin:12px auto;padding:12px;background:#ffe4e6;color:#9f1239;border-radius:12px;font-family:sans-serif">JavaScriptが無効な環境で開かれています。このゲームはSafari/Chromeなど、JavaScriptを実行できるブラウザで開いてください。</div></noscript>
<div id="runtimeStatus" style="max-width:640px;margin:8px auto 0;padding:8px 12px;border-radius:10px;background:#fff3cd;color:#664d03;font:12px -apple-system,BlinkMacSystemFont,sans-serif">JavaScript確認中…</div>
<div class="app">
  <div class="top">
    <div class="header">
      <div><div class="day">DAY <span id="day">1</span></div><div class="small">AI会話型 恋愛シミュレーション</div></div>
      <div style="text-align:right"><div class="turn" id="turnLabel">☀ 朝</div><div class="small">1日3ターン</div></div>
    </div>
    <div class="stats">
      <div class="stat"><b>♥ <span id="affection">35</span></b><span>好感度</span></div>
      <div class="stat"><b>☺ <span id="mood">70</span></b><span>機嫌</span></div>
      <div class="stat"><b>🍽 <span id="fullness">20</span></b><span>満腹度</span></div>
      <div class="stat"><b><span id="weight">58.4</span>kg</b><span>体重</span></div>
    </div>
  </div>

  <div class="hero">
    <img id="characterImage" src="misaki_01.webp" alt="キャラクター立ち絵" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'800\' height=\'1000\' viewBox=\'0 0 800 1000\'%3E%3Crect width=\'800\' height=\'1000\' fill=\'%23f1e2e8\'/%3E%3Ctext x=\'400\' y=\'500\' text-anchor=\'middle\' dominant-baseline=\'middle\' font-family=\'sans-serif\' font-size=\'42\' fill=\'%237d5365\'%3ECharacter Image%3C/text%3E%3C/svg%3E';}" />
    <div class="badge"><span id="height">165</span>cm / <span id="weightBadge">58.4</span>kg ・ <span id="bodyType">Average</span></div>
  </div>

  <div class="panel">
    <div class="nameRow"><div class="name" id="charName">美咲</div><div class="bodyType" id="bodyTypeTop">Average</div></div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <textarea id="message" placeholder="メッセージを入力…"></textarea>
      <button type="button" class="send" id="sendBtn">送信</button>
    </div>
    <div class="controls">
      <button type="button" class="btn primary" id="advanceBtn">次の時間帯へ</button>
      <button type="button" class="btn" id="eventBtn">食事イベント</button>
      <button type="button" class="btn" id="statusBtn">ステータス表示</button>
      <button type="button" class="btn danger" id="resetBtn">最初から</button>
    </div>
  </div>

  <div class="panel">
    <details>
      <summary><b>設定 / OpenAI API</b></summary>
      <div class="settingsGrid">
        <label class="small">APIキー</label>
        <input id="apiKey" type="password" placeholder="sk-...（未入力ならデモ会話）" autocomplete="off" />
        <label class="small">モデル名</label>
        <input id="modelName" value="gpt-5.6-luna" />
        <label class="small">キャラクター名</label>
        <input id="nameInput" value="美咲" />
        <label class="small">身長(cm)</label>
        <input id="heightInput" type="number" value="165" min="130" max="210" />
        <label class="small">立ち絵ファイルのベース名</label>
        <input id="imageBase" value="misaki" />
        <button type="button" class="btn primary" id="saveSettings">設定を保存</button>
        <div class="hint">このHTMLを公開サイトに置く場合、ブラウザへAPIキーを直接保存する方式は安全ではありません。本番版では自分のサーバーを経由してAPIを呼ぶ構成にしてください。この試作版では端末内localStorageにのみ保存します。</div>
      </div>
    </details>
    <details>
      <summary><b>ゲームログ</b></summary>
      <div class="log" id="gameLog"></div>
    </details>
  </div>
</div>

<script>
const DEFAULT_STATE={
  day:1,turn:0,affection:35,mood:70,fullness:20,hunger:40,weight:58.4,startWeight:58.4,
  name:'美咲',height:165,imageBase:'misaki',history:[],gameLog:[],apiKey:'',model:'gpt-5.6-luna'
};
let state=load();
const turns=[{label:'☀ 朝',key:'morning'},{label:'☁ 昼',key:'noon'},{label:'🌙 夜',key:'night'}];
const $=id=>document.getElementById(id);
function clamp(v,min=0,max=100){return Math.max(min,Math.min(max,v));}
function bodyType(){const bmi=state.weight/((state.height/100)**2);if(bmi<18.5)return 'Slim';if(bmi<23)return 'Average';if(bmi<27)return 'Curvy';if(bmi<32)return 'Chubby';return 'Very Chubby';}
function imageStage(){const d=state.weight-state.startWeight;if(d<3)return 1;if(d<8)return 2;if(d<15)return 3;return 4;}
function currentImage(){return `${state.imageBase}_${String(imageStage()).padStart(2,'0')}.webp`;}
function save(){try{localStorage.setItem('aiRomanceGameState',JSON.stringify(state));return true;}catch(e){console.warn('セーブ不可:',e);return false;}}
function load(){try{return {...DEFAULT_STATE,...JSON.parse(localStorage.getItem('aiRomanceGameState')||'{}')}}catch(e){console.warn('セーブデータ読込不可:',e);return {...DEFAULT_STATE}}}
function render(){
  $('day').textContent=state.day;$('turnLabel').textContent=turns[state.turn].label;$('affection').textContent=Math.round(state.affection);$('mood').textContent=Math.round(state.mood);$('fullness').textContent=Math.round(state.fullness);$('weight').textContent=state.weight.toFixed(1);$('weightBadge').textContent=state.weight.toFixed(1);$('height').textContent=state.height;$('charName').textContent=state.name;
  const bt=bodyType();$('bodyType').textContent=bt;$('bodyTypeTop').textContent=bt;$('characterImage').src=currentImage();
  $('apiKey').value=state.apiKey||'';$('modelName').value=state.model||'gpt-5.6-luna';$('nameInput').value=state.name;$('heightInput').value=state.height;$('imageBase').value=state.imageBase;
  const chat=$('chat');chat.innerHTML='';state.history.forEach(m=>addBubble(m.role,m.content,m.meta,false));chat.scrollTop=chat.scrollHeight;
  $('gameLog').innerHTML=state.gameLog.slice().reverse().map(x=>`<div>• ${escapeHtml(x)}</div>`).join('')||'<div>まだログはありません。</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function addBubble(role,content,meta='',persist=true){
  const div=document.createElement('div');div.className='msg '+(role==='assistant'?'ai':role==='user'?'you':'system');div.textContent=content;if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;div.appendChild(m)}$('chat').appendChild(div);$('chat').scrollTop=$('chat').scrollHeight;if(persist){state.history.push({role,content,meta});if(state.history.length>60)state.history=state.history.slice(-60);save();}
}
function log(text){state.gameLog.push(`DAY ${state.day} ${turns[state.turn].label}: ${text}`);if(state.gameLog.length>120)state.gameLog=state.gameLog.slice(-120);save();}
function decay(){state.fullness=clamp(state.fullness-20);state.hunger=clamp(state.hunger+18);state.mood=clamp(state.mood+(Math.random()*4-2));}
function advance(){decay();state.turn++;if(state.turn>=3){state.turn=0;state.day++;state.weight=Math.max(35,state.weight + (state.fullness>70?0.08:state.fullness<20?-0.03:0));log('翌日に進みました');}else log('次の時間帯へ進みました');addBubble('system',`${turns[state.turn].label}になりました。`);save();render();}
function foodEvent(){const amount=15+Math.floor(Math.random()*26);state.fullness=clamp(state.fullness+amount);state.hunger=clamp(state.hunger-amount);const gain=(amount/100)*(0.05+Math.random()*0.12);state.weight=Math.round((state.weight+gain)*10)/10;state.mood=clamp(state.mood+3);log(`食事イベント：満腹度 +${amount} / 体重 ${gain.toFixed(2)}kg相当変化`);addBubble('system',`${state.name}と食事をした。満腹度が上がった。`);save();render();}
function status(){addBubble('system',`DAY ${state.day} / ${turns[state.turn].label}\n好感度 ${Math.round(state.affection)}｜機嫌 ${Math.round(state.mood)}｜空腹 ${Math.round(state.hunger)}｜満腹 ${Math.round(state.fullness)}\n${state.height}cm / ${state.weight.toFixed(1)}kg｜体型 ${bodyType()}｜開始時から ${(state.weight-state.startWeight).toFixed(1)}kg`);}
function demoReply(text){const t=text.toLowerCase();let aff=0,mood=0,reply='うん。そういう話、ちゃんと聞いていたいかも。';if(/好き|可愛い|かわいい|会いた/.test(text)){aff=3;mood=3;reply='……そういうこと言われると、ちょっと照れる。でも、嬉しい。';}else if(/太|体重|痩/.test(text)){reply=`体型のこと？ 今は${state.weight.toFixed(1)}kgくらい。自分でも少し変わってきた気はする。`;mood-=1;}else if(/食べ|ご飯|ごはん|ケーキ|ラーメン/.test(text)){reply=state.fullness>75?'今はかなりお腹いっぱい。でも、一緒にいる時間はまだ終わってほしくないな。':'それいいね。何を食べるか一緒に決めたい。';mood+=2;}else if(/おはよう/.test(text)){reply='おはよう。朝からメッセージ来ると、ちょっと嬉しい。';aff+=1;}state.affection=clamp(state.affection+aff);state.mood=clamp(state.mood+mood);return reply;}
function systemPrompt(){return `あなたは恋愛シミュレーションゲーム内の成人女性キャラクター「${state.name}」です。自然な日本語で会話してください。\n現在: DAY ${state.day}, ${turns[state.turn].key}\n身長:${state.height}cm 体重:${state.weight.toFixed(1)}kg 体型:${bodyType()} 開始体重:${state.startWeight.toFixed(1)}kg\n好感度:${Math.round(state.affection)} 機嫌:${Math.round(state.mood)} 空腹:${Math.round(state.hunger)} 満腹度:${Math.round(state.fullness)}\nゲーム側の数値を勝手に変更・捏造せず、この状態に沿って反応してください。返答は1〜4文程度。プレイヤーへの反応として自然に。`}
async function askAI(text){
  if(!state.apiKey)return demoReply(text);
  const recent=state.history.filter(x=>x.role==='user'||x.role==='assistant').slice(-12).map(x=>({role:x.role,content:x.content}));
  const body={model:state.model||'gpt-5.6-luna',messages:[{role:'system',content:systemPrompt()},...recent,{role:'user',content:text}],temperature:.9};
  const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},body:JSON.stringify(body)});
  if(!res.ok){let info='';try{info=JSON.stringify(await res.json())}catch(e){}throw new Error(`APIエラー ${res.status} ${info}`)}
  const data=await res.json();return data.choices?.[0]?.message?.content?.trim()||'……うまく言葉が出てこない。';
}
async function send(){
  const text=$('message').value.trim();
  if(!text){addBubble('system','メッセージを入力してから「送信」を押してください。','',false);$('message').focus();return;}
  $('message').value='';
  $('sendBtn').disabled=true;
  $('sendBtn').textContent='会話中…';
  addBubble('user',text);
  try{
    const reply=await askAI(text);
    const positive=/好き|可愛い|かわいい|嬉|会いた|大切|ありがとう/.test(text);
    state.affection=clamp(state.affection+(positive?1:0));
    addBubble('assistant',reply,`${turns[state.turn].label} / DAY ${state.day}`);
    log('会話しました');
  }catch(e){
    console.error(e);
    const fallback=demoReply(text);
    addBubble('system','AI接続に失敗したため、デモ会話に切り替えました。','',false);
    addBubble('assistant',fallback,`${turns[state.turn].label} / DAY ${state.day}`);
    log('API接続エラー：デモ会話へ切替');
  }finally{
    $('sendBtn').disabled=false;
    $('sendBtn').textContent='送信';
    save();
    render();
  }
}
function bindUI(){
  const statusEl=document.getElementById('runtimeStatus');
  if(statusEl){statusEl.textContent='JavaScript：正常に動作中';statusEl.style.background='#d1e7dd';statusEl.style.color='#0f5132';}
  $('sendBtn').addEventListener('click',send);
  $('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  $('advanceBtn').addEventListener('click',advance);
  $('eventBtn').addEventListener('click',foodEvent);
  $('statusBtn').addEventListener('click',status);
  $('saveSettings').addEventListener('click',()=>{state.apiKey=$('apiKey').value.trim();state.model=$('modelName').value.trim()||'gpt-5.6-luna';state.name=$('nameInput').value.trim()||'美咲';state.height=Number($('heightInput').value)||165;state.imageBase=$('imageBase').value.trim()||'misaki';save();render();addBubble('system','設定を保存しました。');});
  $('resetBtn').addEventListener('click',()=>{if(confirm('ゲームデータを最初からやり直しますか？')){try{localStorage.removeItem('aiRomanceGameState');}catch(e){}state={...DEFAULT_STATE};save();render();addBubble('assistant',`おはよう。今日からよろしくね。`,`${turns[state.turn].label} / DAY ${state.day}`);}});
  if(!state.history.length){state.history.push({role:'assistant',content:'おはよう。今日からよろしくね。',meta:'☀ 朝 / DAY 1'});save();}
  render();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',bindUI);}else{bindUI();}
</script>
</body>
</html>
