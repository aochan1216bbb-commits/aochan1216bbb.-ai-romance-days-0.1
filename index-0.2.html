<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI Romance Days</title>
<style>
:root{--bg:#f7f2f5;--card:#fff;--text:#2a2327;--muted:#7e7178;--accent:#c86f93;--accent2:#f0c4d5;--shadow:0 8px 28px rgba(68,37,50,.12)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(#f9f5f7,#efe5ea);color:var(--text);min-height:100vh}
button,input,textarea,select{font:inherit} button{touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08);cursor:pointer}.hidden{display:none!important}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;padding:10px 0 8px;background:linear-gradient(rgba(247,242,245,.98),rgba(247,242,245,.88),rgba(247,242,245,0));backdrop-filter:blur(8px)}
.header{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}.day{font-weight:800;font-size:20px}.turn{color:var(--accent);font-weight:800}.small{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}.stat{background:var(--card);border-radius:14px;padding:9px 6px;text-align:center;box-shadow:0 4px 16px rgba(68,37,50,.08)}.stat b{display:block;font-size:14px}.stat span{font-size:11px;color:var(--muted)}
.hero{margin-top:8px;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);position:relative}.hero img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eadde3}.badge{position:absolute;left:12px;bottom:12px;background:rgba(32,24,28,.72);color:#fff;padding:8px 10px;border-radius:12px;font-size:12px;backdrop-filter:blur(6px)}
.panel{background:var(--card);border-radius:20px;margin-top:10px;padding:14px;box-shadow:var(--shadow)}.nameRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.name{font-size:20px;font-weight:800}.bodyType{font-size:12px;background:#f2e5eb;color:#8a4c68;padding:5px 8px;border-radius:999px}
.profileMini{font-size:12px;color:var(--muted);line-height:1.6;margin:-2px 0 8px}.chat{height:280px;overflow:auto;padding:2px 2px 8px;scroll-behavior:smooth}.msg{max-width:86%;padding:10px 12px;border-radius:16px;margin:8px 0;line-height:1.5;white-space:pre-wrap;word-break:break-word}.ai{background:#f3e8ed;border-bottom-left-radius:5px}.you{margin-left:auto;background:#dceefc;border-bottom-right-radius:5px}.system{margin:8px auto;max-width:95%;background:#f4f4f4;color:#6e666a;font-size:12px;text-align:center}.meta{font-size:10px;color:#8c8187;margin-top:4px}
.composer{display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;min-height:48px;max-height:120px;resize:vertical;border:1px solid #dccbd3;border-radius:14px;padding:12px;background:#fff;outline:none}.composer textarea:focus{border-color:var(--accent)}.send{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:13px 16px;font-weight:800}.send:disabled{opacity:.45}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:0;border-radius:13px;padding:11px;background:#eee5e9;color:#4d4147;font-weight:700}.btn.primary{background:#2f2830;color:#fff}.btn.danger{background:#f7d9dc;color:#9c3842}.btn.accent{background:#f3dce6;color:#7f3e5a}
details{margin-top:10px}.settingsGrid{display:grid;gap:8px;margin-top:10px}.settingsGrid input,.settingsGrid select{width:100%;border:1px solid #dccbd3;border-radius:11px;padding:10px}.hint{font-size:11px;color:var(--muted);line-height:1.45}.log{font-size:12px;max-height:150px;overflow:auto;background:#faf7f8;border-radius:12px;padding:8px}
/* character select */
.selectWrap{padding:20px 0 30px}.selectTitle{text-align:center;margin:12px 0 4px;font-size:28px}.selectSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}.characterGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.charCard{border:0;background:var(--card);padding:0;border-radius:20px;overflow:hidden;text-align:left;box-shadow:var(--shadow);color:var(--text)}.charCard:active{transform:scale(.985)}.charThumb{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eadde3}.charInfo{padding:11px}.charInfo strong{font-size:18px}.charInfo .rel{font-size:11px;color:var(--accent);font-weight:700;margin-top:2px}.charInfo .desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px}.continueMark{display:inline-block;font-size:10px;background:#eee5e9;padding:3px 6px;border-radius:999px;margin-top:6px}.selectSettings{margin-top:14px;background:var(--card);padding:12px;border-radius:18px;box-shadow:var(--shadow)}
@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.chat{height:240px}.characterGrid{gap:8px}.charInfo{padding:9px}}
</style>
</head>
<body>
<noscript><div style="max-width:640px;margin:12px auto;padding:12px;background:#ffe4e6;color:#9f1239;border-radius:12px;font-family:sans-serif">JavaScriptが無効です。Safari/Chromeなどで開いてください。</div></noscript>
<div id="runtimeStatus" style="max-width:640px;margin:8px auto 0;padding:8px 12px;border-radius:10px;background:#fff3cd;color:#664d03;font:12px -apple-system,BlinkMacSystemFont,sans-serif">JavaScript確認中…</div>
<div class="app">
<section id="selectScreen" class="selectWrap">
  <h1 class="selectTitle">AI Romance Days</h1><div class="selectSub">話したいキャラクターを選択</div>
  <div id="characterGrid" class="characterGrid"></div>
  <div class="selectSettings"><details><summary><b>OpenAI API 設定</b></summary><div class="settingsGrid"><label class="small">APIキー</label><input id="globalApiKey" type="password" placeholder="未入力ならデモ会話" autocomplete="off"><label class="small">モデル名</label><input id="globalModel" value="gpt-5.6-luna"><button class="btn primary" id="saveGlobalSettings" type="button">設定を保存</button><div class="hint">API設定は5人共通です。公開サイトでAPIキーを直接ブラウザ保存する方式は本番運用には向きません。</div></div></details></div>
</section>

<section id="gameScreen" class="hidden">
  <div class="top"><div class="header"><div><div class="day">DAY <span id="day">1</span></div><div class="small" id="headerRelationship">AI会話型 恋愛シミュレーション・経済・食事システムv1</div></div><div style="text-align:right"><div class="turn" id="turnLabel">☀ 朝</div><div class="small">1日3ターン</div></div></div>
  <div class="stats"><div class="stat"><b>♥ <span id="affection">0</span></b><span>好感度</span></div><div class="stat"><b>☺ <span id="mood">0</span></b><span>機嫌</span></div><div class="stat"><b>🍽 <span id="fullness">20</span></b><span>満腹度</span></div><div class="stat"><b>🛡 <span id="restraint">50</span></b><span>抑止力</span></div><div class="stat"><b><span id="weight">0</span>kg</b><span>体重</span></div><div class="stat"><b>¥<span id="money">0</span></b><span>所持金</span></div></div></div>
  <div class="hero"><img id="characterImage" alt="キャラクター立ち絵"><div class="badge"><span id="height">0</span>cm / <span id="weightBadge">0</span>kg ・ <span id="bodyType">-</span></div></div>
  <div class="panel"><div class="nameRow"><div class="name" id="charName">-</div><div class="bodyType" id="bodyTypeTop">-</div></div><div class="profileMini" id="profileMini"></div><div class="chat" id="chat"></div><div class="composer"><textarea id="message" placeholder="メッセージを入力…"></textarea><button type="button" class="send" id="sendBtn">送信</button></div><div class="settingsGrid" style="margin-top:10px"><label class="small">勧める食事</label><select id="mealSelect"><option value="japanese">和食</option><option value="ramen">ラーメン</option><option value="fried">揚げ物</option><option value="dessert">デザート</option></select><button type="button" class="btn accent" id="eventBtn">選んだ食事を勧める</button><label class="small">プレゼント</label><select id="giftSelect"><option value="snack">お菓子の詰め合わせ ¥700</option><option value="flowers">花束 ¥1,800</option><option value="accessory">アクセサリー ¥4,500</option><option value="luxury">高級なプレゼント ¥9,000</option></select><button type="button" class="btn accent" id="giftBtn">プレゼントする</button></div><div class="controls"><button type="button" class="btn primary" id="advanceBtn">次の時間帯へ</button><button type="button" class="btn" id="workBtn">バイトする</button><button type="button" class="btn" id="statusBtn">ステータス表示</button><button type="button" class="btn accent" id="characterSelectBtn">キャラ選択へ</button><button type="button" class="btn danger" id="resetBtn" style="grid-column:1/-1">このキャラを最初から</button></div></div>
  <div class="panel"><details><summary><b>キャラクタープロフィール</b></summary><div class="log" id="profileDetail"></div></details><details><summary><b>ゲームログ</b></summary><div class="log" id="gameLog"></div></details></div>
</section>
</div>
<script>
const CHARACTERS={
 risa:{id:'risa',name:'梨沙',age:18,height:153,startWeight:45,personality:'明るい、活発、前向き、しっかり者',speech:'タメ口、普通',relationship:'幼馴染かつクラスメイト',affection:50,mood:50,restraint:50,appetite:'普通',gainTendency:'普通',exercise:'普通',bodyView:'少し痩せたいと思っている。太りたくはない。',favoriteFoods:['甘いもの','パン類'],features:'幼馴染である主人公が少し気になっている。そのため、主人公にどう見られているかを気にする。ちょっと泣き虫。',rules:'基本ポジティブに話す。体重が増えると少しネガティブになる。抑止力が高いと食事は断る。甘いものの場合は抑止力が高くても断らない場合がある。',imageBase:'risa'},
 emi:{id:'emi',name:'絵美',age:17,height:170,startWeight:52,personality:'男勝り、活発、衝動型、少し怒りっぽい',speech:'ちょっと暴力的、キツめ、タメ口',relationship:'クラスメイト',affection:30,mood:40,restraint:90,appetite:'よく食べる',gainTendency:'かなり太りにくい',exercise:'頻繁',bodyView:'今がベスト。部活もあるので、このままキープしたい。',favoriteFoods:['揚げ物','ご飯類'],features:'陸上部のエース。部活に命をかけている。タイムが伸びなくなることに強い危機感を覚える。',rules:'基本勝気な話し方。太ったことを指摘されると認めずに怒る。太ると過度な食事制限をして抑止力を下げがち。',imageBase:'emi'},
 yui:{id:'yui',name:'結衣',age:30,height:158,startWeight:50,personality:'おっとり、少し自虐的、母性あり',speech:'柔らかい、タメ口',relationship:'お隣さん',affection:30,mood:70,restraint:30,appetite:'普通',gainTendency:'太りやすい',exercise:'基本なし',bodyView:'最近太り始めて気にしている。痩せたい。',favoriteFoods:['甘いもの','ご飯類','麺類'],features:'シングルマザー。昔はかなりモテていた。最近は子育てなどもあり、あまりチヤホヤされていない。また、最近太りやすくなったのでかなり気にしているが、食欲を抑えられない。',rules:'主人公との年齢差に躊躇いがちだが、かっこいいとは思っている。体型を気にした発言が多い。好感度が低いうちは誘いにも慎重。プレゼントは基本断れない。抑止力が高いほど躊躇はするものの結局食べてしまう。抑止力が高い状態で食べると強く後悔する。体重が増えると油物を好むようになる。',imageBase:'yui'},
 erika:{id:'erika',name:'絵里香',age:18,height:160,startWeight:48,personality:'わがまま、高圧的、高飛車',speech:'お嬢様口調、生意気',relationship:'クラスメイト',affection:10,mood:10,restraint:80,appetite:'少食',gainTendency:'太りにくい',exercise:'あまりしない',bodyView:'ずっとこのままの体型だったので、そもそも太るとは思っていない。太ったら焦る。',favoriteFoods:[],features:'主人公に悪い印象あり。ただ、チョロい。性格のせいで友達が少ない。相手に依存する癖あり。',rules:'序盤はずっとツンデレ。好感度が上がるとデレ要素が高くなり、依存度も上がる。太ったことがないので太るとかなり焦る。抑止力は上がりやすく下がりやすい。抑止力が高いと食事やプレゼントも断る。主人公の誘いによって好きな食べ物が増える。',imageBase:'erika'},
 rei:{id:'rei',name:'怜',age:18,height:155,startWeight:42,personality:'不思議ちゃん、独特、他人の目を気にしない',speech:'小声でボソボソ、タメ口',relationship:'クラスメイト',affection:20,mood:50,restraint:60,appetite:'少食',gainTendency:'普通',exercise:'あまりしない',bodyView:'興味なし。太り始めると、太ることに快感を覚え始める。',favoriteFoods:[],features:'他人の目を気にしない。独特。基本他人と分かり合えないと思っている。',rules:'基本淡々と話す。主人公には人として興味はあるが恋愛感情はない。好感度が上がると心を開き、最終的には好きになる。体重が増えるたびに、体重が増えることに快感を覚え始める。主人公の誘いによって好きな食べ物が増える。',imageBase:'rei'}
};
const turns=[{label:'☀ 朝',key:'morning'},{label:'☁ 昼',key:'noon'},{label:'🌙 夜',key:'night'}];
let activeId=null,state=null;
const $=id=>document.getElementById(id); const clamp=(v,min=0,max=100)=>Math.max(min,Math.min(max,v));
function safeGet(k,fallback){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function globalSettings(){return safeGet('aiRomanceGlobalSettings',{apiKey:'',model:'gpt-5.6-luna'})}
function saveGlobal(){safeSet('aiRomanceGlobalSettings',{apiKey:$('globalApiKey').value.trim(),model:$('globalModel').value.trim()||'gpt-5.6-luna'});alert('API設定を保存しました。')}
function defaultState(id){const c=CHARACTERS[id];return {characterId:id,day:1,turn:0,affection:c.affection,mood:c.mood,fullness:20,hunger:40,restraint:c.restraint,weight:c.startWeight,startWeight:c.startWeight,history:[],gameLog:[],favoriteFoods:[...c.favoriteFoods],lastFoodResult:null,foodOfferTurnKey:null,foodPressureCount:0,money:2500,workCount:0,lastFoodTurnKey:null,lastFoodWasRefused:false}}
function stateKey(id){return 'aiRomanceState_v3_'+id} function loadState(id){return {...defaultState(id),...safeGet(stateKey(id),{})}} function save(){if(activeId&&state)safeSet(stateKey(activeId),state)}
function bodyType(){const c=CHARACTERS[activeId],bmi=state.weight/((c.height/100)**2);if(bmi<18.5)return'Slim';if(bmi<23)return'Average';if(bmi<27)return'Curvy';if(bmi<32)return'Chubby';return'Very Chubby'}
function imageStage(){const d=state.weight-state.startWeight;if(d<3)return 1;if(d<8)return 2;if(d<15)return 3;return 4} function imagePath(c){return `assets/${c.imageBase}_${String(imageStage()).padStart(2,'0')}.webp`}
function placeholder(el,name){if(el.dataset.fallback==='1')return;el.dataset.fallback='1';const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><rect width="100%" height="100%" fill="#f1e2e8"/><text x="50%" y="48%" text-anchor="middle" font-family="sans-serif" font-size="72" fill="#7d5365">${name}</text><text x="50%" y="56%" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#9f7b8a">立ち絵を assets に追加</text></svg>`;el.src='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderSelect(){const g=$('characterGrid');g.innerHTML='';Object.values(CHARACTERS).forEach(c=>{const saved=safeGet(stateKey(c.id),null);const card=document.createElement('button');card.type='button';card.className='charCard';card.innerHTML=`<img class="charThumb" src="assets/${c.imageBase}_01.webp" alt="${c.name}"><div class="charInfo"><strong>${c.name}</strong> <span class="small">${c.age}歳</span><div class="rel">${c.relationship}</div><div class="desc">${c.personality}<br>${c.height}cm / ${c.startWeight}kg</div>${saved?`<span class="continueMark">DAY ${saved.day||1} から続き</span>`:''}</div>`;card.querySelector('img').addEventListener('error',e=>placeholder(e.currentTarget,c.name));card.addEventListener('click',()=>startCharacter(c.id));g.appendChild(card)});const gs=globalSettings();$('globalApiKey').value=gs.apiKey||'';$('globalModel').value=gs.model||'gpt-5.6-luna'}
function startCharacter(id){activeId=id;state=loadState(id);if(!state.history.length){const c=CHARACTERS[id];state.history.push({role:'assistant',content:firstGreeting(c),meta:'☀ 朝 / DAY 1'});save()}$('selectScreen').classList.add('hidden');$('gameScreen').classList.remove('hidden');render()}
function firstGreeting(c){if(c.id==='risa')return'おはよ。今日も一緒だね。なんか話す？';if(c.id==='emi')return'おはよ。朝から何？ 私、部活あるんだけど。';if(c.id==='yui')return'おはよう。こんな時間から会うと、ちょっと不思議な感じだね。';if(c.id==='erika')return'……朝から何ですの？ 用があるなら手短にしてくださいませ。';return'……おはよう。今日は、何の話する？'}
function render(){if(!activeId||!state)return;const c=CHARACTERS[activeId];$('day').textContent=state.day;$('turnLabel').textContent=turns[state.turn].label;$('affection').textContent=Math.round(state.affection);$('mood').textContent=Math.round(state.mood);$('fullness').textContent=Math.round(state.fullness);$('restraint').textContent=Math.round(state.restraint);$('weight').textContent=state.weight.toFixed(1);$('money').textContent=Math.round(state.money??2500).toLocaleString();$('weightBadge').textContent=state.weight.toFixed(1);$('height').textContent=c.height;$('charName').textContent=c.name;$('headerRelationship').textContent=c.relationship;const bt=bodyType();$('bodyType').textContent=bt;$('bodyTypeTop').textContent=bt;$('profileMini').textContent=`${c.age}歳｜${c.relationship}｜${c.speech}｜バイト${state.workCount||0}回`;const img=$('characterImage');img.dataset.fallback='';img.src=imagePath(c);img.onerror=()=>placeholder(img,c.name);const chat=$('chat');chat.innerHTML='';state.history.forEach(m=>addBubble(m.role,m.content,m.meta,false));chat.scrollTop=chat.scrollHeight;$('gameLog').innerHTML=state.gameLog.slice().reverse().map(x=>`<div>• ${escapeHtml(x)}</div>`).join('')||'<div>まだログはありません。</div>';$('profileDetail').innerHTML=`<b>性格</b><br>${escapeHtml(c.personality)}<br><br><b>食欲 / 太りやすさ / 運動</b><br>${escapeHtml(c.appetite)} / ${escapeHtml(c.gainTendency)} / ${escapeHtml(c.exercise)}<br><br><b>体型・体重への考え</b><br>${escapeHtml(c.bodyView)}<br><br><b>好きな食べ物</b><br>${escapeHtml(state.favoriteFoods.length?state.favoriteFoods.join('、'):'特になし')}<br><br><b>その他</b><br>${escapeHtml(c.features)}`}
function addBubble(role,content,meta='',persist=true){const div=document.createElement('div');div.className='msg '+(role==='assistant'?'ai':role==='user'?'you':'system');div.textContent=content;if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;div.appendChild(m)}$('chat').appendChild(div);$('chat').scrollTop=$('chat').scrollHeight;if(persist){state.history.push({role,content,meta});if(state.history.length>60)state.history=state.history.slice(-60);save()}}
function log(text){state.gameLog.push(`DAY ${state.day} ${turns[state.turn].label}: ${text}`);if(state.gameLog.length>120)state.gameLog=state.gameLog.slice(-120);save()}
function currentTurnKey(){return `${state.day}:${state.turn}`}
function foodOfferAlreadyUsed(){return false}
function markFoodOfferUsed(){}
function decay(){state.fullness=clamp(state.fullness-20);state.hunger=clamp(state.hunger+18);state.mood=clamp(state.mood+(Math.random()*4-2))}
function advance(){decay();state.turn++;if(state.turn>=3){state.turn=0;state.day++;state.weight=Math.max(30,state.weight+(state.fullness>70?.08:state.fullness<20?-.03:0));log('翌日に進みました')}else log('次の時間帯へ進みました');state.lastFoodWasRefused=false;state.lastFoodTurnKey=null;addBubble('system',`${turns[state.turn].label}になりました。`);save();render()}
const MEAL_CATEGORIES={
 japanese:{name:'和食',tiers:[
  {label:'焼き魚定食',price:700,fullness:24,weight:.08,restraintHit:3,tags:['rice']},

  {label:'豪華和食膳＋大盛り丼＋甘味',price:2900,fullness:78,weight:.60,restraintHit:11,tags:['rice','sweet']},
  {label:'超特盛和食フルコース＋おかわり自由',price:3800,fullness:90,weight:.82,restraintHit:14,tags:['rice','sweet']}
 ]},
 ramen:{name:'ラーメン',tiers:[

const GIFTS={snack:{name:'お菓子の詰め合わせ',price:700,affection:2,mood:2},flowers:{name:'花束',price:1800,affection:4,mood:5},accessory:{name:'アクセサリー',price:4500,affection:8,mood:7},luxury:{name:'高級なプレゼント',price:9000,affection:13,mood:10}};
function mealTier(){const d=state.weight-state.startWeight;if(d<3)return 0;if(d<8)return 1;if(d<15)return 2;if(d<25)return 3;if(d<40)return 4;if(d<60)return 5;return 6}
function mealTierLabel(){const i=mealTier();return ['+0〜3kg未満','+3〜8kg','+8〜15kg','+15〜25kg','+25〜40kg','+40〜60kg','+60kg以上'][i]}
function getMealOffer(category){const cat=MEAL_CATEGORIES[category]||MEAL_CATEGORIES.japanese;const item=cat.tiers[mealTier()];return {...item,id:category,name:item.label,category,isGift:false}}
function detectFoodOffer(text){let category=null;if(/ラーメン/.test(text))category='ramen';else if(/揚げ|唐揚げ|からあげ|フライ|とんかつ/.test(text))category='fried';else if(/ケーキ|スイーツ|デザート|パフェ|アイス|チョコ/.test(text))category='dessert';else if(/和食|定食|ご飯|ごはん|寿司|魚/.test(text))category='japanese';if(!category||!/食べ|行こ|行か|どう|奢|おご/.test(text))return null;return getMealOffer(category)}
async function foodEvent(){const offer=getMealOffer($('mealSelect').value);state.money=state.money??2500;if(state.money<offer.price){addBubble('system',`${offer.name}を勧めるには ¥${offer.price.toLocaleString()} 必要です。バイトでお金を稼いでください。`,'所持金不足');return}state.money-=offer.price;const pressure=state.lastFoodWasRefused&&state.lastFoodTurnKey===currentTurnKey();let pressureResult=null;if(pressure){pressureResult=pressurePenalty('いいから食べてよ');addBubble('system',pressureResult.summary,'強引な再提案')}addBubble('user',`${offer.name}食べない？`,`購入 ¥${offer.price.toLocaleString()}`);const result=resolveFoodOffer(offer);addBubble('system',result.summary,'食事判定');log(`${offer.name}を購入 ¥${offer.price}。${result.accepted?'食べた':'断った'}`);try{addBubble('assistant',await askAI(`${offer.name}食べない？`,result,pressureResult),`${turns[state.turn].label} / DAY ${state.day}`)}catch(e){addBubble('assistant',demoReply('',result),`${turns[state.turn].label} / DAY ${state.day}`)}save();render()}
function gainFactor(c){return c.gainTendency==='太りやすい'?1.35:c.gainTendency==='太りにくい'?.75:c.gainTendency==='かなり太りにくい'?.55:1}
function foodAcceptanceChance(c,offer){let score=48;score+=(state.affection-50)*0.28;score+=(state.hunger-40)*0.42;score-=state.fullness*0.38;score-=state.restraint*0.42;if(c.appetite==='よく食べる')score+=14;if(c.appetite==='少食')score-=12;if(state.favoriteFoods.some(x=>offer.name.includes(x)||x.includes(offer.name)))score+=18;if(c.id==='risa'&&(offer.tags.includes('sweet')||offer.tags.includes('bread')))score+=26;if(c.id==='emi')score-=state.restraint*0.18;if(c.id==='yui'){score+=20;if(offer.isGift)score=96;else score=Math.max(score,70-state.fullness*0.18)}if(c.id==='erika')score-=state.restraint*0.28;if(c.id==='rei')score+=(state.weight-state.startWeight)*2.2;return clamp(score,3,97)}
function resolveFoodOffer(offer,text){const c=CHARACTERS[activeId];if(!offer)return null;const chance=foodAcceptanceChance(c,offer);let accepted=Math.random()*100<chance;if(c.id==='yui'&&offer.isGift)accepted=true;if(c.id==='yui'&&!offer.isGift&&state.restraint>=75&&state.fullness<92)accepted=Math.random()<0.82;if(c.id==='erika'&&state.restraint>=85&&state.affection<70)accepted=Math.random()<0.08;const before={fullness:state.fullness,hunger:state.hunger,restraint:state.restraint,weight:state.weight};let regret=0,weightGain=0,restraintDelta=0,fullnessDelta=0;if(accepted){fullnessDelta=Math.max(6,Math.round(offer.fullness*(100-state.fullness)/100+offer.fullness*.35));state.fullness=clamp(state.fullness+fullnessDelta);state.hunger=clamp(state.hunger-fullnessDelta);weightGain=offer.weight*gainFactor(c)*(0.85+Math.random()*.3);state.weight=Math.round((state.weight+weightGain)*10)/10;restraintDelta=-Math.max(1,Math.round(offer.restraintHit*(0.7+Math.random()*.5)));if(c.id==='emi'&&state.weight>state.startWeight+1)restraintDelta=+Math.max(2,Math.round(offer.restraintHit*.7));if(c.id==='erika')restraintDelta=Math.random()<.5?-8:+8;if(c.id==='yui'&&before.restraint>=65){regret=Math.round((before.restraint-55)*.9+8);state.mood=clamp(state.mood-Math.min(12,Math.round(regret/5)))}if(c.id==='rei'&&state.weight>state.startWeight){state.mood=clamp(state.mood+Math.min(8,Math.round((state.weight-state.startWeight)*.7)))}state.restraint=clamp(state.restraint+restraintDelta)}else{restraintDelta=-Math.max(1,Math.round(2+state.restraint/40));if(c.id==='erika')restraintDelta-=1;state.restraint=clamp(state.restraint+restraintDelta);state.mood=clamp(state.mood-1)}
 const result={accepted,food:offer.name,isGift:offer.isGift,chance:Math.round(chance),fullnessDelta,weightGain:Number(weightGain.toFixed(2)),restraintDelta,regret,before,after:{fullness:state.fullness,hunger:state.hunger,restraint:state.restraint,weight:state.weight},summary:accepted?`${c.name}は${offer.name}を食べた。満腹度 +${fullnessDelta}、体重 +${weightGain.toFixed(2)}kg相当、抑止力 ${restraintDelta>=0?'+':''}${restraintDelta}${regret?`、後悔度 ${regret}`:''}`:`${c.name}は${offer.name}を断った。我慢で抑止力 ${restraintDelta}`,log:accepted?`${offer.name}を受け入れた（判定${Math.round(chance)}%）。満腹度 +${fullnessDelta} / 体重 +${weightGain.toFixed(2)}kg相当 / 抑止力 ${restraintDelta>=0?'+':''}${restraintDelta}`:`${offer.name}を断った（判定${Math.round(chance)}%）。我慢で抑止力 ${restraintDelta}`};state.lastFoodResult=result;state.lastFoodWasRefused=!accepted;state.lastFoodTurnKey=currentTurnKey();return result}
function workIncome(){return Math.min(5000,1200+Math.floor((state.workCount||0)/3)*350)}
function doWork(){state.money=state.money??2500;state.workCount=state.workCount||0;const income=workIncome();state.workCount++;state.money+=income;addBubble('system',`バイトで ¥${income.toLocaleString()} 稼ぎました。バイトをしたため時間が進みます。`,`バイト #${state.workCount}`);log(`バイト +¥${income}（通算${state.workCount}回）`);advance()}
async function giveGift(){const g=GIFTS[$('giftSelect').value];state.money=state.money??2500;if(state.money<g.price){addBubble('system',`${g.name}を買うには ¥${g.price.toLocaleString()} 必要です。`,'所持金不足');return}state.money-=g.price;let chance=clamp(50+(state.affection-30)*.7-state.restraint*.08,10,95);const c=CHARACTERS[activeId];if(c.id==='yui')chance=98;if(c.id==='erika'&&state.restraint>=70)chance-=25;const accepted=Math.random()*100<chance;if(accepted){state.affection=clamp(state.affection+g.affection);state.mood=clamp(state.mood+g.mood)}addBubble('user',`${g.name}、プレゼント。`,`購入 ¥${g.price.toLocaleString()}`);addBubble('system',accepted?`${c.name}は${g.name}を受け取った。好感度 +${g.affection}、機嫌 +${g.mood}`:`${c.name}は${g.name}を受け取らなかった。`,'プレゼント判定');log(`${g.name}を購入 ¥${g.price}。${accepted?'受け取った':'断った'}`);save();render()}
function status(){const c=CHARACTERS[activeId];addBubble('system',`DAY ${state.day} / ${turns[state.turn].label}\n好感度 ${Math.round(state.affection)}｜機嫌 ${Math.round(state.mood)}｜空腹 ${Math.round(state.hunger)}｜満腹 ${Math.round(state.fullness)}｜抑止力 ${Math.round(state.restraint)}\n${c.height}cm / ${state.weight.toFixed(1)}kg｜体型 ${bodyType()}｜開始時から ${(state.weight-state.startWeight).toFixed(1)}kg\n所持金 ¥${Math.round(state.money??2500).toLocaleString()}｜バイト ${state.workCount||0}回｜次回収入 ¥${workIncome().toLocaleString()}｜食事Lv.${mealTier()+1}（${mealTierLabel()}）`)}
function pressurePenalty(text){const c=CHARACTERS[activeId];const forceful=/お願い|頼む|いいから|食べてよ|食べなよ|絶対|もっと|無理やり|断らないで|せっかく/.test(text);let affLoss=forceful?6:3,moodLoss=forceful?5:2;if(c.id==='erika'){affLoss+=2;moodLoss+=1}if(c.id==='yui'&&state.affection<50)affLoss+=1;state.affection=clamp(state.affection-affLoss);state.mood=clamp(state.mood-moodLoss);const result={affectionDelta:-affLoss,moodDelta:-moodLoss,forceful,summary:`一度断った直後にさらに強く勧めたため、${c.name}は圧を感じた。好感度 -${affLoss}、機嫌 -${moodLoss}`,log:`断った直後の強引な再提案。好感度 -${affLoss} / 機嫌 -${moodLoss}`};log(result.log);return result}
function pressureDemoReply(){const c=CHARACTERS[activeId];if(c.id==='risa')return'もう、さっき断ったでしょ。しつこいのは嫌だよ。';if(c.id==='emi')return'だからいらないって。しつこい。';if(c.id==='yui')return'ごめんね、そんなに押されるとちょっと困っちゃう。';if(c.id==='erika')return'しつこいですわ。不愉快です。';return'……断ったのに。そういうの、少し嫌。'}
function demoReply(text,foodResult=null){const c=CHARACTERS[activeId];let aff=0,mood=0,reply='……うん。';if(foodResult){if(foodResult.accepted){if(c.id==='risa')reply=foodResult.food==='甘いもの'||foodResult.food==='パン'?'……それなら食べる。ちょっとだけね！':'うーん……まあ、今日はいいか。食べよ。';if(c.id==='emi')reply='……分かった。食べる。でもこれで部活に響いたら最悪だからね。';if(c.id==='yui')reply=foodResult.regret>0?'……また食べちゃった。断ろうとは思ったんだけどな。あとで絶対後悔するやつ……。':'え、いいの？ ……じゃあ、少しだけもらおうかな。';if(c.id==='erika')reply='べ、別にあなたに勧められたからではありませんわ。今回は特別ですの。';if(c.id==='rei')reply='……食べる。こういうのも、悪くないかも。'}else{if(c.id==='risa')reply='今日はやめとく。ちょっと気にしてるし。';if(c.id==='emi')reply='いらない。今は部活優先。';if(c.id==='yui')reply='ごめんね。今日はさすがにやめておく。';if(c.id==='erika')reply='結構ですわ。わたくし、今は要りませんの。';if(c.id==='rei')reply='……今日はいい。お腹、そこまで空いてない。'}return reply}if(c.id==='risa')reply='うんうん、それで？';if(c.id==='emi')reply=/太|体重/.test(text)?'は？ 太ってないし。変なこと言わないでよ。':'で、何？';if(c.id==='yui')reply='ふふ、そうなんだ。';if(c.id==='erika')reply=state.affection<40?'べ、別にあなたと話したいわけではありませんわ。':'……少しくらいなら、お付き合いしてあげてもよろしくてよ。';if(c.id==='rei')reply=state.affection<50?'……そう。あなたって、やっぱり少し変わってるね。':'……あなたと話すの、前より好きかも。';if(/好き|可愛い|かわいい|会いた/.test(text)){aff+=2;mood+=2}state.affection=clamp(state.affection+aff);state.mood=clamp(state.mood+mood);return reply}
function systemPrompt(){const c=CHARACTERS[activeId];return `あなたは恋愛シミュレーションゲーム内の女性キャラクター「${c.name}」として会話します。キャラクター設定を最優先し、自然な日本語で返答してください。\n\n【基本プロフィール】\n年齢:${c.age}歳\n身長:${c.height}cm\n性格:${c.personality}\n話し方:${c.speech}\n主人公との関係:${c.relationship}\n食欲:${c.appetite}\n太りやすさ:${c.gainTendency}\n運動習慣:${c.exercise}\n体型・体重への考え:${c.bodyView}\n現在の好きな食べ物:${state.favoriteFoods.length?state.favoriteFoods.join('、'):'特になし'}\nその他の特徴:${c.features}\n\n【絶対に守るキャラクタールール】\n${c.rules}\n\n【現在のゲーム状態】\nDAY ${state.day} / ${turns[state.turn].key}\n体重:${state.weight.toFixed(1)}kg（開始時${state.startWeight.toFixed(1)}kg、変化${(state.weight-state.startWeight).toFixed(1)}kg）\n体型:${bodyType()}\n好感度:${Math.round(state.affection)}/100\n機嫌:${Math.round(state.mood)}/100\n空腹:${Math.round(state.hunger)}/100\n満腹度:${Math.round(state.fullness)}/100\n抑止力:${Math.round(state.restraint)}/100\n主人公の所持金:${Math.round(state.money??2500)}円\nバイト回数:${state.workCount||0}\n\n抑止力は高いほど食事の誘惑・勧めを断りやすく、低いほど受け入れやすい。食事を断った場合は「我慢して精神的な余力を使った」として抑止力が少し下がる。ただしキャラクタールールに個別指定がある場合はそちらを優先する。ゲーム側の数値を勝手に変更したり、未発生の出来事を事実として作らない。好感度が低いうちは急に恋愛感情を強めない。返答は原則1〜4文。`}
async function askAI(text,foodResult=null,pressureResult=null){const gs=globalSettings();if(!gs.apiKey)return demoReply(text,foodResult);const recent=state.history.filter(x=>x.role==='user'||x.role==='assistant').slice(-12).map(x=>({role:x.role,content:x.content}));let resolved='';if(foodResult){resolved=`\n\n【この発言に対するゲーム側の確定判定】\nプレイヤーは「${foodResult.food}」を勧めた。${CHARACTERS[activeId].name}は${foodResult.accepted?'食べることを受け入れた':'断った'}。この結果は確定済みであり、絶対に逆転させないこと。${foodResult.accepted?`満腹度+${foodResult.fullnessDelta}、体重+${foodResult.weightGain.toFixed(2)}kg相当、抑止力${foodResult.restraintDelta>=0?'+':''}${foodResult.restraintDelta}${foodResult.regret?`、強い後悔あり（後悔度${foodResult.regret}）`:''}`:`我慢で抑止力${foodResult.restraintDelta}`}。返答では、この結果をキャラクターらしい反応として自然に表現すること。数値そのものを口にする必要はない。`;}if(pressureResult){resolved+=`\n\n【強引な再提案】\nキャラクターは直前の食事を一度断ったが、プレイヤーがさらに強く勧めた。${CHARACTERS[activeId].name}は圧・不快感・困惑のいずれかをキャラクターらしく示すこと。好感度${pressureResult.affectionDelta}、機嫌${pressureResult.moodDelta}はゲーム側ですでに確定済み。その不快感・困惑をキャラクターらしく表現する。`; }
const body={model:gs.model||'gpt-5.6-luna',messages:[{role:'system',content:systemPrompt()+resolved},...recent,{role:'user',content:text}],temperature:.9};const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+gs.apiKey},body:JSON.stringify(body)});if(!res.ok)throw new Error('API '+res.status);const data=await res.json();return data.choices?.[0]?.message?.content?.trim()||'……。'}
async function send(){const text=$('message').value.trim();if(!text){addBubble('system','メッセージを入力してください。','',false);return}$('message').value='';$('sendBtn').disabled=true;$('sendBtn').textContent='会話中…';addBubble('user',text);const offer=detectFoodOffer(text);let foodResult=null,pressureResult=null;if(offer){state.money=state.money??2500;if(state.money<offer.price){addBubble('system',`${offer.name}を勧めるには ¥${offer.price.toLocaleString()} 必要です。所持金が足りません。`,'所持金不足')}else{state.money-=offer.price;if(state.lastFoodWasRefused&&state.lastFoodTurnKey===currentTurnKey()&&/お願い|頼む|いいから|食べてよ|食べなよ|絶対|もっと|断らないで/.test(text)){pressureResult=pressurePenalty(text);addBubble('system',pressureResult.summary,'強引な再提案')}foodResult=resolveFoodOffer(offer);addBubble('system',foodResult.summary,'判定結果');log(`${offer.name}を購入 ¥${offer.price}。${foodResult.accepted?'食べた':'断った'}`)}}try{let reply=await askAI(text,foodResult,pressureResult);addBubble('assistant',reply,`${turns[state.turn].label} / DAY ${state.day}`);if(!foodResult&&!pressureResult)log('会話しました')}catch(e){addBubble('system','AI接続に失敗したためデモ会話に切り替えました。','',false);addBubble('assistant',pressureResult?pressureDemoReply():demoReply(text,foodResult),`${turns[state.turn].label} / DAY ${state.day}`);log('API接続エラー')}finally{$('sendBtn').disabled=false;$('sendBtn').textContent='送信';save();render()}}
function resetCurrent(){if(!activeId)return;const c=CHARACTERS[activeId];if(confirm(`${c.name}の進行データを最初からやり直しますか？`)){try{localStorage.removeItem(stateKey(activeId))}catch(e){}state=defaultState(activeId);state.history=[{role:'assistant',content:firstGreeting(c),meta:'☀ 朝 / DAY 1'}];save();render()}}
function bindUI(){const statusEl=$('runtimeStatus');statusEl.textContent='JavaScript：正常に動作中';statusEl.style.background='#d1e7dd';statusEl.style.color='#0f5132';$('saveGlobalSettings').addEventListener('click',saveGlobal);$('sendBtn').addEventListener('click',send);$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('advanceBtn').addEventListener('click',advance);$('eventBtn').addEventListener('click',foodEvent);$('giftBtn').addEventListener('click',giveGift);$('workBtn').addEventListener('click',doWork);$('statusBtn').addEventListener('click',status);$('characterSelectBtn').addEventListener('click',backToSelect);$('resetBtn').addEventListener('click',resetCurrent);renderSelect()}
